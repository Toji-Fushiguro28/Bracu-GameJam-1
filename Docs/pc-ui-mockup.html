<title>Whitmore PC Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&display=swap">
<style>
/* Layout: the game's dim library behind one PC window (status bar, header, page body);
   design notes for the current page sit under it. Colour variants only swap the background tokens. */
:root {
  color-scheme: dark;
  --room: #16110d;
  --room-2: #241a13;
  --note-fg: #e9dcc6;
  --note-dim: #a8957b;
  --note-line: #3a2c21;
  --legendary: #5f0f40;
  --epic: #3d348b;
  --display: "Jersey 15", "Courier New", monospace;
  --body: "Jersey 10", "Courier New", monospace;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
body { background: var(--room); color: var(--note-fg); font-family: var(--ui); }

/* ---------- Skin A: Card Catalogue (walnut frame, parchment page, brass, oxblood) ---------- */
[data-skin="card"] {
  --frame: #5a3a24;
  --frame-hi: #7a5234;
  --frame-lo: #3b2516;
  --page: #d9c6a0;
  --page-2: #c9b48c;
  --card: #e8d9b8;
  --ink: #3b2a1d;
  --ink-dim: #65503c;
  --rule: #b49a70;
  --accent: #d67840;
  --accent-ink: #fff6e8;
  --gold: rgb(235, 200, 120);
  --gold-ink: #3b2a1d;
  --ok: #4f6b3a;
  --warn: #a8701c;
  --bad: #8e3b32;
  --sel: #e2bf86;
  --hover: #d6c09a;
  --btn: #d8b77c;
  --btn-border: #6e4c30;
  --status-bg: #3b2516;
  --status-fg: #f0dfbf;
  --red-rule: #c45b4d;
  --blue-rule: rgba(90, 120, 160, 0.18);
  --brass: #d9b36a;
  --brass-dark: #8a6a2e;
  --brass-ink: #3b2516;
  --close: #b5523f;
  --close-dark: #6e2a20;
  --close-ink: #fbe9dc;
  --star: #c98a1c;
  --scroll: #9b7b55;
  --case: #e8d0b9; --case-hi: #f7ebdc; --case-lo: #c4a487; --case-line: #493333; --bezel: #3b2a1d; --led: #7fd36a;
  --btn-light: rgba(255, 255, 255, 0.55); --btn-shade: rgba(90, 55, 30, 0.22); --btn-edge: #a8542a;
  --pip: #d67840; --pip-hi: #f2a873; --pip-lo: #a8542a; --pip-line: #493333; --pip-off: #a68d68;
  --scroll-hi: #b8976d;
  --glow-text: #e0a030;
  --glow-halo: rgba(255, 200, 90, 0.85);
  --sheet-bg: transparent; --sheet-border: transparent; --sheet-pad: 0px; --sheet-surface: var(--page);
  --desk-ink: #3b2a1d; --desk-dim: #65503c;
  --input: var(--card); --pop-bar: var(--gold); --ready: var(--gold);
  --btn-off: #d9cba8; --ink-off: #8a7658;
}
/* Oxblood leather desk: every list sits on a sheet, so the dark screen never sits under dark text. */
.pc[data-pal="leather"] {
  --page: #5e2b26; --red-rule: #d6a15e;
  --sheet-bg: var(--card); --sheet-border: var(--rule); --sheet-pad: 10px; --sheet-surface: var(--card);
  --desk-ink: #f3e4c4; --desk-dim: #d6b19a;
}
/* Brass cards, inputs and controls on the leather desk, checked so nothing blends */
.pc[data-comp="brass"]     {
  --card: #e3c98f; --page-2: #cfb071; --rule: #a6844a; --ink-dim: #55402a;
  --hover: #d6b670;                    /* a clear step darker than the card */
  --sel: #f1dfb2;                      /* picked row: the button colour plus an orange outline */
  --input: #f8edcf;                    /* inputs, dropdowns, tooltips: lighter than the card they sit on */
  --btn: #f1dfb2; --btn-border: #6e4c30; --pip-off: #a6844a;
  --gold: #f6e2a8;                     /* badges: pale gold with a dark pixel edge */
  --warn: #7d4f0c;                     /* amber text and the POPULAR stamp, dark enough for gold paper */
  --pop-bar: #9a6510;                  /* the Popular bar on rows (gold would vanish on brass) */
  --ready: #c0661f;                    /* "you can afford this" borders */
  --btn-off: #d8c79c; --ink-off: #7f6a48;  /* disabled: flat, greyed gold, no bevel */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* Scrollbars like the game's TravelBook kit bar: a slim inset track and a rounded handle */
.pc ::-webkit-scrollbar { width: 14px; height: 14px; }
.pc ::-webkit-scrollbar-track { background: var(--page-2); border: 1px solid var(--rule); border-radius: 7px; margin: 4px 0; box-shadow: inset 0 1px 2px rgba(0,0,0,0.15); }
.pc ::-webkit-scrollbar-thumb { min-height: 40px; border-radius: 7px; border: 2px solid var(--page-2); background: linear-gradient(90deg, var(--scroll-hi), var(--scroll) 55%); }
.pc ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.pc ::-webkit-scrollbar-button, .pc ::-webkit-scrollbar-corner { display: none; background: transparent; }
@supports not selector(::-webkit-scrollbar) { .pc * { scrollbar-color: var(--scroll) var(--page-2); } }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }

/* ---------- Mockup chrome (outside the game screen) ---------- */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; margin: 0; letter-spacing: 0.5px; }
.top p { margin: 6px 0 0; color: var(--note-dim); max-width: 60ch; font-size: 14px; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; }
.controls { align-items: center; }
.lbl-ui { font: 600 12px var(--ui); letter-spacing: 1.2px; text-transform: uppercase; color: var(--note-dim); }
.seg { display: inline-flex; border: 1px solid var(--note-line); border-radius: 8px; overflow: hidden; }
.seg button { font: 13px var(--ui); color: var(--note-dim); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--note-line); }
.seg button[aria-pressed="true"] { background: #d67840; color: #1b120c; font-weight: 600; }
.seg button:focus-visible, .pc button:focus-visible, .pc input:focus-visible, .pc select:focus-visible { outline: 2px solid #d67840; outline-offset: 2px; }

/* ---------- The room and the PC window ---------- */
.stage {
  position: relative;
  padding: clamp(10px, 3vw, 36px);
  border-radius: 14px;
  background: radial-gradient(ellipse at 50% 30%, var(--room-2), var(--room) 75%);
}
.pc {
  position: relative;
  max-width: 1080px;
  margin: 0 auto;
  border-radius: 14px;
  padding: 12px;
  background: linear-gradient(var(--frame-hi), var(--frame) 40%, var(--frame-lo));
  box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  font-family: var(--body);
  color: var(--ink);
}
.screen {
  position: relative;
  height: 680px;
  display: flex;
  flex-direction: column;
  border-radius: 8px;
  overflow: hidden;
  background: var(--page);
}

/* Status line: the clock keeps running while the PC is open */
/* Title bar: window buttons on the left, name centred, day/clock/coins on the right */
.status {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 6px 14px 7px;
  background: var(--status-bg); color: var(--status-fg);
  font-size: 20px; line-height: 1;
}
.status .brand { font-family: var(--display); font-size: 24px; letter-spacing: 2px; text-align: center; white-space: nowrap; }
.status .stats { display: flex; gap: 10px; justify-content: flex-end; align-items: center; min-width: 0; }
.winbtns { display: flex; gap: 7px; align-items: center; }
.winbtn {
  width: 22px; height: 22px; padding: 0; display: grid; place-items: center; cursor: pointer;
  border-radius: 50%; border: 2px solid var(--brass-dark); background: var(--brass); color: var(--brass-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
}
.winbtn svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; fill: none; opacity: 0.75; }
.winbtn:hover svg { opacity: 1; }
.winbtn.close { background: var(--close); border-color: var(--close-dark); color: var(--close-ink); }
/* Logged off / minimised screen */
.off { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; background: var(--status-bg); color: var(--status-fg); font: 24px var(--body); }
.off b { display: block; font: 40px var(--display); font-weight: 400; letter-spacing: 2px; margin-bottom: 8px; }
.pc.max { max-width: none; }
.status .stat { white-space: nowrap; font-variant-numeric: tabular-nums; }
.status .coins { color: var(--gold); }
.status .dot { opacity: 0.4; }

.head { display: flex; align-items: center; gap: 14px; padding: 14px 20px 10px; border-bottom: 2px solid var(--red-rule); }
.head h2 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; margin: 0; flex: 1; letter-spacing: 1px; }
.head .sub { color: var(--ink-dim); font-size: 20px; }
.body { flex: 1; min-height: 0; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.foot { color: var(--ink-dim); font-size: 18px; text-align: center; padding: 0 20px 12px; }

/* Buttons */
/* Pixel-art buttons: square 3px outline with the corner pixels cut away, a light top row and a dark bottom
   band like the kit's buttons, and a 2px press-down on click. */
.btn {
  font: 22px var(--body); line-height: 1; color: var(--ink);
  background: var(--btn); border: 3px solid var(--btn-border); border-radius: 0;
  padding: 4px 14px 9px; cursor: pointer; white-space: nowrap;
  clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
  box-shadow: inset 0 3px 0 var(--btn-light), inset 0 -4px 0 var(--btn-shade);
}
.btn:hover:not(:disabled) { background: var(--accent); border-color: var(--btn-edge); color: var(--accent-ink); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 4px 0 var(--btn-shade); padding: 6px 14px 7px; }
.btn:disabled { opacity: 1; cursor: default; background: var(--btn-off); color: var(--ink-off); border-color: var(--rule); box-shadow: none; }
.btn.primary:disabled { background: var(--btn-off); color: var(--ink-off); border-color: var(--rule); } /* solid, so it never shows the leather through */
.pc .btn:focus-visible { outline: none; border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--btn-edge); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover:not(:disabled) { background: var(--bad); color: var(--accent-ink); border-color: var(--bad); }
.btn.small { font-size: 19px; padding: 3px 10px 7px; }
.btn.small:active:not(:disabled) { padding: 5px 10px 5px; }
.btn .cost { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; vertical-align: middle; font-variant-numeric: tabular-nums; }
.btn .cost .px { margin: 0 1px; } /* kit coin at its native 1x size, still pixel-crisp */
.btn.ready { border-color: var(--ready); box-shadow: inset 0 3px 0 var(--btn-light), inset 0 -4px 0 rgba(235,200,120,0.55); }

/* Badges / chips */
.chip { display: inline-block; font-size: 17px; line-height: 1; padding: 3px 7px 5px; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-dim); white-space: nowrap; }
.badge { display: inline-block; font-size: 17px; line-height: 1; padding: 3px 8px 5px; border-radius: 4px; background: var(--gold); color: var(--gold-ink); white-space: nowrap; }
.badge.urgent { background: var(--bad); color: var(--accent-ink); }
.badge.new { background: var(--accent); color: var(--accent-ink); }

/* ---------- Catalogue ---------- */
.cat { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
.col { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.search { position: relative; }
.search input {
  width: 100%; font: 22px var(--body); color: var(--ink);
  background: var(--input); border: 2px solid var(--btn-border); border-radius: 6px; padding: 6px 12px 8px;
}
.search input::placeholder { color: var(--ink-dim); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.drop { position: relative; }
.menu {
  position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 160px;
  background: var(--input); border: 2px solid var(--btn-border); border-radius: 6px; padding: 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
.menu button { display: block; width: 100%; text-align: left; font: 20px var(--body); color: var(--ink); background: none; border: 0; padding: 3px 10px 5px; border-radius: 4px; cursor: pointer; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.menu.tall { max-height: 340px; overflow-y: auto; }
.menu .hdr { font-size: 16px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-dim); border-top: 1px solid var(--rule); margin-top: 4px; padding: 6px 10px 2px; }
.menu .sub { padding-left: 24px; color: var(--ink); }
.menu .sub:hover, .menu .sub[aria-checked="true"] { color: var(--accent-ink); }

.list { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--rule); }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  padding: 7px 10px 8px; border-bottom: 1px solid var(--rule); cursor: pointer;
}
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); outline: 3px solid var(--accent); outline-offset: -3px; } /* picked book: always obvious */
.row .t { font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; min-width: 0; }
.row .t span.name { overflow: hidden; text-overflow: ellipsis; }
.row .s { grid-column: 1; font-size: 18px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 18px; line-height: 22px; color: var(--ink-dim); margin-top: 1px; }
.row .m span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.row .m .sep { opacity: 0.5; }
.row .m .bad { color: var(--bad); }
/* Pixel icons: the kit's coin, plus a shelf and a damaged-book icon drawn to match. Always whole-pixel scale (x2). */
.px { image-rendering: pixelated; image-rendering: crisp-edges; flex-shrink: 0; }
.row .n { grid-row: 1 / span 3; grid-column: 2; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
.row .n b { display: block; font-weight: 400; font-size: 30px; }
.row .n small { font-size: 16px; color: var(--ink-dim); }
.row.popular { box-shadow: inset 4px 0 0 var(--pop-bar); }
/* Tier accents: left border on the row, border + badge on the card. Tier wins over Popular. */
.row.epic { box-shadow: inset 5px 0 0 var(--epic); }
.row.legendary { box-shadow: inset 5px 0 0 var(--legendary); }
.cardpane.epic{ border-color: var(--epic); box-shadow: 0 4px 0 var(--epic); }
.cardpane.legendary{ border-color: var(--legendary); box-shadow: 0 4px 0 var(--legendary), 0 0 0 3px rgba(95, 15, 64, 0.25); }
.cardpane.epic .cardtop { border-bottom-color: var(--epic); }
.cardpane.legendary .cardtop { border-bottom-color: var(--legendary); }
.badge.epic { background: var(--epic); color: #fff; }
.badge.legendary { background: var(--legendary); color: #ffe48f; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.count-line { font-size: 18px; color: var(--desk-dim); }
/* Lists on a parchment sheet (only visible in the desk variants) */
.sheet { background: var(--sheet-bg); border: 2px solid var(--sheet-border); border-bottom-width: 4px; padding-inline: var(--sheet-pad); clip-path: var(--notch2); }

/* Details: an index card */
.cardpane {
  position: relative; min-height: 0; display: flex; flex-direction: column;
  background: var(--card); border: 2px solid var(--rule); border-radius: 6px;
  box-shadow: 0 4px 0 var(--rule);
}
.cardtop { padding: 12px 16px 8px; border-bottom: 2px solid var(--red-rule); }
.callno { position: absolute; top: 10px; right: 14px; font: 20px var(--display); color: var(--ink-dim); letter-spacing: 1px; }
.cardtop h3 { font: 30px/1.05 var(--display); font-weight: 400; margin: 0 70px 2px 0; text-wrap: balance; }
.cardtop .by { font-size: 20px; color: var(--ink-dim); }
.cardtop .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cardscroll {
  flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 10px;
  background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--blue-rule) 27px 28px);
 
}
.facts { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 14px; font-size: 20px; line-height: 26px; margin-bottom: 8px; }
.facts dt { color: var(--ink-dim); }
.facts dd { margin: 0; }
.abstract { font-size: 21px; line-height: 28px; margin: 0; }
.abstract-label { font-size: 17px; color: var(--ink-dim); letter-spacing: 1px; text-transform: uppercase; line-height: 28px; }
.reserve { margin-top: 10px; padding: 6px 10px 8px; border: 2px dashed var(--bad); border-radius: 6px; font-size: 19px; line-height: 1.25; color: var(--bad); }
.reserve.done { border-color: var(--ok); color: var(--ok); }
.stamp {
  position: absolute; right: 18px; top: 74px; transform: rotate(-9deg);
  font: 26px var(--display); letter-spacing: 2px; color: var(--bad);
  border: 3px solid var(--bad); border-radius: 6px; padding: 0 10px 3px; opacity: 0.85; pointer-events: none;
}
.stamp.gold { color: var(--warn); border-color: var(--warn); }
.actions { border-top: 1px solid var(--rule); padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.actions .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.actions .msg { font-size: 18px; color: var(--ink-dim); text-align: center; min-height: 20px; }
.actions .msg.good { color: var(--ok); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink-dim); font-size: 22px; padding: 20px; }

/* ---------- Shop ---------- */
.tabs { display: flex; gap: 10px; }
.tab { font: 24px var(--body); line-height: 1; background: transparent; color: var(--desk-dim); border: 0; border-bottom: 3px solid transparent; padding: 4px 6px 8px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--desk-ink); border-bottom-color: var(--accent); }
.tab.ready { color: var(--warn); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.ugrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ucard { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; gap: 4px 12px; padding: 12px; background: var(--card); border: 2px solid var(--rule); border-radius: 8px; }
.ucard.ready { border-color: var(--ready); }
.ucard.locked { background: var(--page-2); } /* locked: a duller card, never see-through on the dark desk */
.ucard.locked h4, .ucard.locked p { color: var(--ink-dim); }
.ucard.locked .uico { opacity: 0.55; }
.uico { grid-row: 1 / span 2; width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; background: var(--page-2); border: 2px solid var(--rule); }
.ucard h4 { font: 24px/1 var(--display); font-weight: 400; margin: 2px 0 0; }
.ucard p { margin: 0; font-size: 18px; line-height: 1.2; color: var(--ink-dim); }
.ufoot { grid-column: 1 / span 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.pips { display: flex; gap: 4px; }
.pip { width: 18px; height: 10px; border: 2px solid var(--ink-dim); border-radius: 2px; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.srow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px; background: var(--card); border: 2px solid var(--rule); border-radius: 8px; margin-bottom: 10px; }
.srow.ready { border-color: var(--ready); }
.srow h4 { font: 26px/1 var(--display); font-weight: 400; margin: 0; }
.srow p { margin: 2px 0 0; font-size: 18px; line-height: 1.25; color: var(--ink-dim); }
.srow .who { font-size: 20px; }
.avatar { width: 56px; height: 56px; border-radius: 8px; display: grid; place-items: center; background: var(--page-2); border: 2px solid var(--rule); }

/* ---------- Members ---------- */
.mem { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.mtable { width: 100%; border-collapse: collapse; font-size: 20px; }
.mtable th { text-align: left; font-weight: 400; color: var(--ink-dim); font-size: 17px; padding: 4px 8px; border-bottom: 2px solid var(--rule); position: sticky; top: 0; background: var(--sheet-surface); }
.mtable td { padding: 6px 8px 7px; border-bottom: 1px solid var(--rule); vertical-align: middle; white-space: nowrap; }
.mtable td.num { text-align: right; font-variant-numeric: tabular-nums; }
.hearts { line-height: 0; }
.hearts .px { margin-right: 1px; vertical-align: middle; }
.libcard { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--card); border: 2px solid var(--rule); border-radius: 8px; box-shadow: 0 4px 0 var(--rule); min-height: 0; overflow-y: auto; }
.libcard h3 { font: 28px/1 var(--display); font-weight: 400; margin: 0; padding-bottom: 6px; border-bottom: 2px solid var(--red-rule); display: flex; justify-content: space-between; gap: 10px; }

  const price = (b, ex) => Math.max(3, Math.round(b.v * 0.6 * (ex ? 1.5 : 1) * (b.isNew ? NEW_TITLE_BONUS : 1)));
  const salePrice = b => Math.round(b.v * (b.isNew ? NEW_TITLE_BONUS : 1));
  const qty = b => b.g + b.w + b.d;
  // 12-hour clock, minutes in steps of 10, like GameManager.FormatHour
  const fmt = m => { const h = Math.floor(m / 60), mm = Math.floor((m % 60) / 10) * 10; return `${h % 12 || 12}:${String(mm).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
  const hm = t => { const [h, m] = t.split(":").map(Number); return fmt(h * 60 + m); }; // "14:10" -> "2:10 PM"
  const upgReady = () => upgrades.some(u => u[3] < 3 && DAY >= u[4] && coins >= 40 + u[3] * 40);

  // ---------- Notes per screen ----------
  const TABS_NOTE = ["Tabs", ["Tabs are the only way around: Home, Catalogue, Members, Shop, Log, Settings. No Back buttons anywhere.", "The PC opens on Home. The other tabs carry small counts: reservations not ordered yet (red when one is urgent), a card waiting, ★ when an upgrade is affordable.", "The status line shows day, clock and coins on every tab. The clock keeps running while the PC is open."]];
  const NEEDS_NOTE = "“Needs you” only lists things you can fix from the PC. Its buttons open the right tab: “Order” opens a fresh Catalogue so you still search for the book yourself, “Fill in card” opens Members, “See upgrades” opens the Shop. When nothing is waiting it says “All clear”.";
  const NOTES = {
    catalogue: [["What changes", ["Rows are three lines: the title; author · subject; then shelf, order price and damaged copies (only when there are any) with pixel icons. The coin is the kit's own; the shelf and the bandaged-book icons are new, drawn in the kit's colours and outline. Stock is a big number on the right, coloured green, amber or red.", "The details card scrolls, so long abstracts never get clipped. Add to note, Order and Express stay pinned at the bottom.", "Order (tomorrow morning) and Express (+50%, 2 hours) are right on the card.", "A sold-out book shows a stamp and, if someone reserved it, who and by when.", "Every book is listed, including titles the library doesn't have yet. Those sit at the bottom, tagged “New title”, and can be ordered (Show › Not in library lists only them).", "Express is always there for books you can order. After closing it stays visible but greyed out, with a note saying why.", "New titles cost about 30% more to order and sell for about 30% more. Rare books stay far above both. (Numbers are placeholders.)", "Filters are Type, then Subject. Subject stays greyed out until you pick a Type, and then lists only that type's subjects (Magazine: Science & Nature, Puzzles…).", "Archive and Rare Books are Types too. They're worked out from the shelf, so the book data doesn't need a new field.", "Tiers have their own colour: Epic is indigo, Legendary is plum with gold text. Each shows as a left border on the row, a border on the card, and the tier badge. A tier colour replaces the gold Popular border on that row.", "Book subjects are grouped by shelf in the menu (Science shelf: Astronomy, Biology…). The card shows “Shelf: Science” and the subject “Astronomy”, so the two never read as the same word."]],
                ["Kept as is", ["Search matches title, author and tag. Show is still a dropdown (Reserved, Sold out, In stock, Not in library).", "Rare Books can't be ordered (try The Star Codex).", "Add to note goes to the open request, or To Shelve."]]],
    shop: [["What changes", ["The Books tab is gone: ordering moved into the Catalogue.", "Upgrades are cards in a grid with a pixel icon, level pips and price. Affordable ones get the gold border.", "Icons: Repair tools a hammer, Restoration kit a glue bottle, Comfy queue the kit heart, Running shoes a sneaker, Cozy lamps a lamp, Reading nooks an armchair, Town flyers a pinned poster, Book bag a satchel, Stamina the kit energy bolt.", "Staff are one card per role with an icon (Cleaner a broom, Archivist a stack of books, Rare Books attendant a key) and the same Hire / Interview / Cancel / Upgrade button as today."]],
           ["Kept as is", ["The Day Report shop at closing time is untouched.", "Coins now live in the status line instead of the Shop header."]]],
    members: [["What changes", ["Members become a table: name, access, hearts, visits, spent. Easier to scan than stacked text.", "The new card form looks like a library card. The date picker uses three dropdowns, so it no longer needs its own scroll box.", "“Issue card” stays disabled until the name, birthday and access are all filled in."]],
              ["Kept as is", ["Name rules: letters, spaces, hyphens and apostrophes, 30 characters, tidied to Title Case on issue.", "Days that don't exist in the chosen month are greyed out.", "When nobody is waiting, the form shows the same message as today."]]],
    log: [["What changes", ["Each entry has a time, a coloured dot for the outcome, the request, and the result on the right.", "Green is good, amber is pending (reserved), red is lost.", "Money is part of the log: earnings show +coins in green (sales, tips, reading fees, card sign-ups, tidy rewards), spending shows −coins in red.", "Spending rows have a coin instead of a dot: book orders, Express orders, upgrades, staff hires and staff upgrades. Order a book, buy an upgrade or train Janitor Sam and it appears in today's log."]],
          ["Kept as is", ["One button per day, today selected, newest at the top.", "Same rows feed the Day Report's Log tab."]]],
    settings: [["What changes", ["Mode is gone from the PC. It's still picked from the main menu.", "Bigger rows and clearer danger buttons."]],
               ["Kept as is", ["Volume, Music, Fullscreen, Main menu and New game, with the same two-click confirm.", "“Your library saves itself every morning” note."]]],
  };
  const NOTES_HOME = [["Home layout", ["Top row: six numbers to read at a glance (titles, copies on shelf, sold out, visitors served, coins earned today, members).", NEEDS_NOTE, "Middle: the day bar (9:00 AM to 5:30 PM) and reputation on the left; today's popular books on the right.", "The day bar only shows dots: red needs you, green is fine, amber is closing. Hover a dot for the time, who, and which book. Things in the same 10 minutes share one dot with a count, so a busy day never overlaps (try 2:10 PM).", "Bottom: three small ledgers for Today, Collection and Library."]], TABS_NOTE];
  const isUrgentOpen = () => books.some(b => b.res && b.res.urgent && !b.order);

  // ---------- Home tab data ----------
  const today = { served: 7, sold: 4, read: 3, returns: 2, income: 86, angry: 1 };
  const rep = 38, REP_GOAL = 60; // Standard mode goal
  const OPEN = 9 * 60, CLOSE = 17 * 60 + 30;
  const arrivals = []; // Express orders arriving today
  // Pickups booked for today (yesterday's reservations), besides the urgent ones in the books list
  const pickups = [
    { at: "13:20", who: "Omar Haddad", book: "The Salt Road Chronicles", ready: true },
    { at: "14:10", who: "Clara Bennett", book: "Rivers of Bengal", ready: true },
    { at: "15:40", who: "Leo Marsh", book: "Infinity in a Teacup", ready: false },
  ];
  function stats() {
    const lib = books.filter(b => !b.isNew);
    return {
      titles: lib.length,
      copies: lib.reduce((n, b) => n + qty(b), 0),
      soldOut: lib.filter(b => qty(b) === 0).length,
      worn: lib.reduce((n, b) => n + b.w, 0),
      damaged: lib.reduce((n, b) => n + b.d, 0),
      onOrder: books.reduce((n, b) => n + b.order, 0),
      reserved: books.filter(b => b.res).length,
      upgrades: upgrades.reduce((n, u) => n + u[3], 0),
      staff: staff.filter(s => s.state === "hired").length,
    };
  }
  function needs() {
    const items = [];
    books.forEach((b, i) => { if (b.res && !b.order) items.push([b.res.urgent ? "bad" : "warn", `${esc(b.res.who)} needs <b>${esc(b.t)}</b>${b.res.urgent ? ` by ${hm(b.res.due)}` : " tomorrow"}`, b.res.urgent ? "not ordered yet · use Express" : "not ordered yet", "Order", `data-go="catalogue" data-fresh="1"`]); });
    if (!form.done) items.push(["warn", "A visitor is waiting for a library card", "at the counter", "Fill in card", `data-go="members"`]);
    if (upgReady()) items.push(["ok", "An upgrade is affordable", `${coins} coins`, "See upgrades", `data-go="shop"`]);
    return items;
  }
  function needsPanel(max) {
    const items = needs();
    const list = items.slice(0, max).map(([c, t, s, b, attr]) => `<div class="need"><span class="mark" style="background:var(--${c})"></span><span>${t} <small>· ${s}</small></span><button class="btn small" ${attr}>${b}</button></div>`).join("");
    const more = items.length > max ? `<div class="count-line">+${items.length - max} more</div>` : "";
    return `<div class="panel needs"><h3>Needs you <small>${items.length ? items.length + " to do" : ""}</small></h3>${list || `<div class="allclear">All clear. Nothing needs you right now.</div>`}${more}</div>`;
  }
  const kv = rows => `<dl class="kv">${rows.map(([k, v, c]) => `<dt>${k}</dt><dd class="${c || ""}">${v}</dd>`).join("")}</dl>`;
  const repPanel = () => {
    const pct = Math.min(100, rep / REP_GOAL * 100), mid = Math.ceil(REP_GOAL * 0.6) / REP_GOAL * 100;
    return `<div class="panel"><h3>Reputation <small>goal ${REP_GOAL}</small></h3>
      <div class="meter" role="img" aria-label="Reputation ${rep} of ${REP_GOAL}"><i style="width:${pct}%"></i><span class="tier" style="left:${mid}%"></span></div>
      <div class="meter-l"><span>${rep} now</span><span>${REP_GOAL > rep ? (REP_GOAL - rep) + " to go" : "Goal reached!"}</span></div></div>`;
  };
  const stile = (n, l, c) => `<div class="stile"><b class="${c || ""}">${n}</b><span>${l}</span></div>`;
  const leftText = () => { const l = Math.max(0, CLOSE - minutes); return l ? `${Math.floor(l / 60)}h ${l % 60}m until closing` : "closed"; };
  const tlX = m => ((Math.min(Math.max(m, OPEN), CLOSE) - OPEN) / (CLOSE - OPEN) * 100).toFixed(2) + "%";

  function dayPanel() {
    const ticks = []; for (let h = 9; h <= 17; h++) ticks.push(`<span class="tl-tick ${h % 2 ? "" : "odd"}" style="left:${tlX(h * 60)}">${h % 12 || 12} ${h < 12 ? "AM" : "PM"}</span>`);
    const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    // [minute, colour, html for the tooltip]
    const ev = [];
    books.forEach(b => { if (b.res && b.res.urgent) ev.push([toMin(b.res.due), b.order ? "ok" : "bad", `<b>${esc(b.res.who)}</b> picks up<i>${esc(b.t)}</i><em class="${b.order ? "ok" : "bad"}">${b.order ? "On its way" : "Not ordered yet: use Express"}</em>`]); });
    pickups.forEach(p => ev.push([toMin(p.at), p.ready ? "ok" : "bad", `<b>${esc(p.who)}</b> picks up<i>${esc(p.book)}</i><em class="${p.ready ? "ok" : "bad"}">${p.ready ? "Ready on the shelf" : "Not on the shelf yet"}</em>`]));
    arrivals.forEach(a => ev.push([a.at, "ok", `<b>Express delivery</b><i>${esc(a.title)}</i><em>Goes to the book cart</em>`]));
    ev.push([CLOSE, "warn", `<b>Closing time</b><i>Tidy up, then leave by the door</i>`]);
    // Events in the same 10-minute slot share one dot
    const slots = new Map();
    ev.forEach(([m, c, html]) => { const k = Math.floor(m / 10) * 10; const s = slots.get(k) || { c: "ok", items: [] }; s.items.push(html); if (c === "bad" || (c === "warn" && s.c === "ok")) s.c = c; slots.set(k, s); });
    const dots = [...slots].sort((a, b) => a[0] - b[0]).map(([m, s]) => {
      const edge = m >= CLOSE - 90 ? "edge-r" : m <= OPEN + 90 ? "edge-l" : "";
      return `<button class="tl-dot ${s.c} ${edge} ${s.items.length > 1 ? "many" : ""}" data-n="${s.items.length}" style="left:${tlX(m)}" aria-label="${fmt(m)}: ${s.items.length} event${s.items.length > 1 ? "s" : ""}">
        <span class="tip" role="tooltip"><span class="tt">${fmt(m)}</span>${s.items.map(h => `<span class="ev">${h}</span>`).join("")}</span></button>`;
    }).join("");
    return `<div class="panel noclip"><h3><small id="tl-left">${leftText()}</small></h3>
      <div class="tl"><div class="tl-track"><i id="tl-fill" style="width:${tlX(minutes)}"></i></div>${ticks.join("")}<span class="tl-now" id="tl-now" style="left:${tlX(minutes)}"></span>${dots}</div></div>`;
  }

  function homeView() {
    const s = stats();
    const pop = books.filter(b => b.pop);
    return `<div class="home">
      <div class="tiles6">
        ${stile(s.titles, "titles")}${stile(s.copies, "copies on shelf")}${stile(s.soldOut, "sold out", s.soldOut ? "bad" : "")}
        ${stile(today.served, "visitors served")}${stile(today.income, "coins earned today", "ok")}${stile(members.length, "members")}
      </div>
      ${needsPanel(3)}
      <div class="mid">
        <div class="stack">${dayPanel()}${repPanel()}</div>
        <div class="panel"><h3>Popular today <small>sell well today</small></h3>
          <ul class="poplist">${pop.map(b => `<li><span>${esc(b.t)}</span><small>${esc(b.sub)} · ${SHELF[b.sh]}</small><b class="${qty(b) ? "" : "bad"}">${qty(b)}</b></li>`).join("")}</ul></div>
      </div>
      <div class="cols3">
        <div class="panel"><h3>Today <small>Day ${DAY}</small></h3>${kv([["Visitors served", today.served], ["Books sold", today.sold], ["Read here", today.read], ["Returns", today.returns], ["Earned", today.income + " coins", "ok"], ["Left angry", today.angry, today.angry ? "bad" : ""]])}</div>
        <div class="panel"><h3>Collection</h3>${kv([["Titles", s.titles], ["Copies on shelves", s.copies], ["Sold out", s.soldOut, s.soldOut ? "bad" : ""], ["Worn / damaged", `${s.worn} / ${s.damaged}`, s.damaged ? "warn" : ""], ["On order", s.onOrder], ["Reserved", s.reserved]])}</div>
        <div class="panel"><h3>Library</h3>${kv([["Members", members.length], ["Staff", `${s.staff} of 3`], ["Rooms open", "3 of 3"], ["Upgrades", `${s.upgrades} of 27`]])}</div>
      </div>
    </div>`;
  }

  // ---------- Render ----------
  function render() {
    $("coins").textContent = coins + " coins";
    const res = books.filter(b => b.res && !b.order).length, ready = upgReady();
    const tab = (k, n, extra = "", cls = "") => `<button class="navtab ${cls}" role="tab" aria-selected="${page === k}" data-go="${k}">${n}${extra}</button>`;
    $("head").innerHTML = `<nav class="navtabs" role="tablist">
      ${tab("home", "Home")}
      ${tab("catalogue", "Catalogue", res ? `<span class="n ${isUrgentOpen() ? "urgent" : ""}">${res}</span>` : "")}
      ${tab("members", "Members", form.done ? "" : `<span class="n">1</span>`)}
      ${tab("shop", "Shop", ready ? `<span class="star" aria-label="upgrade ready">★</span>` : "", ready && page !== "shop" ? "ready" : "")}
      ${tab("log", "Log")}${tab("settings", "Settings")}</nav><span class="esc-hint">Esc to log off</span>`;
    $("foot").hidden = true;
    $("body").innerHTML = ({ home: homeView, catalogue: catView, shop: shopView, members: memView, log: logView, settings: setView })[page]();
    const notes = page === "home" ? NOTES_HOME : NOTES[page];
    $("notes").innerHTML = notes.map(([h, items]) => `<section><h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></section>`).join("");
  }


  function filtered() {
    const n = q.trim().toLowerCase();
    return books.filter(b => {
      if (n && !(b.t + " " + b.a + " " + b.tag).toLowerCase().includes(n)) return false;
      if (fSub !== "All" && b.sub !== fSub) return false;
      if (fType !== "All" && kind(b) !== fType) return false;
      if (fShow === "Not in library" && !b.isNew) return false;
      if (fShow === "Reserved" && !b.res) return false;
      if (fShow === "Sold out" && (qty(b) > 0 || b.isNew)) return false;
      if (fShow === "In stock" && qty(b) === 0) return false;
      return true;
    }).sort((x, y) => (x.isNew ? 1 : 0) - (y.isNew ? 1 : 0) || (y.pop ? 1 : 0) - (x.pop ? 1 : 0)); // popular first, not-in-library last
  }

  function drop(id, label, value, opts) {
    const open = openMenu === id;
    return `<div class="drop"><button class="btn small" data-menu="${id}" aria-expanded="${open}">${label}: ${value} ▾</button>
      ${open ? `<div class="menu" role="menu">${opts.map(o => `<button role="menuitemradio" aria-checked="${o === value}" data-pick="${id}" data-val="${o}">${o}</button>`).join("")}</div>` : ""}</div>`;
  }

  // Subject only unlocks once a Type is picked; its list depends on the type.
  function subjectFilter() {
    if (fType === "All") return `<div class="drop"><button class="btn small" disabled title="Pick a type first">Subject: pick a type first</button></div>`;
    const open = openMenu === "sub";
    const item = o => `<button role="menuitemradio" class="${fType === "Book" && o !== "All" ? "sub" : ""}" aria-checked="${o === fSub}" data-pick="sub" data-val="${o}">${o}</button>`;
    const items = fType === "Book"
      ? [item("All"), ...Object.entries(BOOK_GROUPS).map(([shelf, subs]) => `<div class="hdr">${shelf} shelf</div>` + subs.map(item).join(""))]
      : ["All", ...SUBJECTS[fType]].map(item);
    return `<div class="drop"><button class="btn small" data-menu="sub" aria-expanded="${open}">Subject: ${fSub} ▾</button>
      ${open ? `<div class="menu ${fType === "Book" ? "tall" : ""}" role="menu">${items.join("")}</div>` : ""}</div>`;
  }

  function catView() {
    const list = filtered();
    const rows = list.map(b => {
      const n = qty(b);
      const cls = b.isNew ? "" : n === 0 ? "bad" : n === 1 || b.w + b.d > 0 ? "warn" : "ok";
      const bits = `${b.a} · ${b.sub}`;
      const meta = [`<span>${px("shelf", 2, "Shelf")}${SHELF[b.sh]}</span>`];
      if (!b.rare) meta.push(`<span>${px("coin", 2, "Price")}${price(b, false)}</span>`);
      if (b.d) meta.push(`<span class="bad">${px("dmg", 2)}${b.d} damaged</span>`);
      return `<div class="row ${b === sel ? "sel" : ""} ${b.tier !== "Normal" ? b.tier.toLowerCase() : b.pop ? "popular" : ""}" data-book="${books.indexOf(b)}" tabindex="0">
        <div class="t"><span class="name">${esc(b.t)}</span>${b.pop ? `<span class="badge">Popular</span>` : ""}${b.res ? `<span class="badge ${b.res.urgent ? "urgent" : ""}">${b.res.urgent ? "Reserved · TODAY" : "Reserved"}</span>` : ""}${b.isNew ? `<span class="badge new">New title</span>` : ""}</div>
        <div class="s">${esc(bits)}</div>
        <div class="m">${meta.join('<span class="sep">·</span>')}</div>
        <div class="n ${cls}">${b.isNew ? `<small>not in<br>library</small>` : `<b>${n}</b><small>${b.order ? `+${b.order} coming` : "on shelf"}</small>`}</div>
      </div>`;
    }).join("") || `<div class="empty">No books match. Try fewer filters.</div>`;

    return `<div class="cat">
      <div class="col">
        <div class="search"><input id="search" type="text" placeholder="search title, author or tag" value="${esc(q)}" autocomplete="off" aria-label="Search books"></div>
        <div class="filters">
          ${drop("type", "Type", fType, ["All", ...TYPES])}
          ${subjectFilter()}
          ${drop("show", "Show", fShow, ["All", "Reserved", "Sold out", "In stock", "Not in library"])}
        </div>
        <div class="count-line">${list.length} ${list.length === 1 ? "book" : "books"}</div>
        <div class="list sheet" role="listbox" aria-label="Books">${rows}</div>
      </div>
      ${detailView()}
    </div>`;
  }

  function detailView() {
    const b = sel;
    if (!b) return `<div class="cardpane"><div class="empty">Select a book to see where it lives,<br>read its abstract, or order more.</div></div>`;
    const n = qty(b);
    const cond = n === 0 ? "-" : [b.g && `${b.g} good`, b.w && `${b.w} worn`, b.d && `${b.d} damaged`].filter(Boolean).join(", ");
    const condCls = b.d ? "bad" : b.w ? "warn" : "";
    const stock = b.isNew ? "not in library" : n > 0 ? `${n} on shelf` : "none left";
    const canOrder = !b.rare;
    const closed = minutes >= 17 * 60 + 30;
    const p = price(b, false), pe = price(b, true);
    let stamp = "";
    if (b.isNew) stamp = `<div class="stamp gold">NEW TITLE</div>`;
    else if (n === 0) stamp = `<div class="stamp">SOLD OUT</div>`;
    else if (b.pop) stamp = `<div class="stamp gold">POPULAR</div>`;
    let res = "";
    if (b.res) {
      const coming = b.order > 0;
      res = `<div class="reserve ${coming ? "done" : ""}">${esc(b.res.who)} reserved this. ${b.res.urgent ? `Needs it <b>TODAY by ${hm(b.res.due)}</b>, so use Express.` : "Picks it up tomorrow."} ${coming ? "On its way." : "NOT ORDERED YET."}</div>`;
    }
    const isNoted = noted.has(b);
    const defaultMsg = b.rare ? "Rare Books stay in the library: they can't be ordered."
      : b.isNew && !b.order ? "New title: costs a little more to order, and sells for more."
      : closed ? "The library is closed: Express is off until tomorrow. Normal orders still arrive in the morning."
      : isNoted ? "Already in your notebook."
      : b.order ? `${b.order} on order. Normal orders arrive tomorrow on the book cart.`
      : "Add to note: goes on the visitor's request in your notebook.";
    return `<div class="cardpane ${b.tier !== "Normal" ? b.tier.toLowerCase() : ""}">
      <div class="callno">${b.sh}</div>
      ${stamp}
      <div class="cardtop">
        <h3>${esc(b.t)}</h3>
        <div class="by">by ${esc(b.a)}</div>
        <div class="tags"><span class="chip">${kind(b)}</span><span class="chip">${b.sub}</span>${b.tag ? b.tag.split(", ").map(t => `<span class="chip">${esc(t)}</span>`).join("") : ""}${b.tier !== "Normal" ? `<span class="badge ${b.tier.toLowerCase()}">${b.tier}</span>` : ""}</div>
      </div>
      <div class="cardscroll">
        <dl class="facts">
          <dt>Shelf</dt><dd>${SHELF[b.sh]}</dd>
          <dt>Stock</dt><dd class="${n === 0 && !b.isNew ? "bad" : ""}">${stock}</dd>
          <dt>Copies</dt><dd class="${condCls}">${cond}</dd>
          <dt>Sells for</dt><dd class="${b.rare ? "warn" : b.isNew ? "ok" : ""}">${b.rare ? "read here only" : salePrice(b) + " coins" + (b.isNew ? " (new title +30%)" : "")}</dd>
        </dl>
        <div class="abstract-label">Abstract</div>
        <p class="abstract">${esc(b.ab)}</p>
        ${res}
      </div>
      <div class="actions">
        <div class="btns">
          <button class="btn" data-act="note" ${isNoted || b.isNew ? "disabled" : ""}>Add to note</button>
          ${canOrder ? `<button class="btn ${b.res && !b.res.urgent && !b.order ? "primary" : ""}" data-act="order" ${coins < p ? "disabled" : ""}>Order ${cost(p)}</button>` : ""}
          ${canOrder ? `<button class="btn ${b.res && b.res.urgent && !b.order && !closed ? "primary" : ""}" data-act="express" ${coins < pe || closed ? "disabled" : ""} title="${closed ? "Express only runs while the library is open" : "Arrives in 2 hours"}">Express ${cost(pe)}</button>` : ""}
        </div>
        <div class="msg ${msgGood ? "good" : ""}">${esc(msg || defaultMsg)}</div>
      </div>
    </div>`;
  }

  function shopView() {
    const ready = upgReady();
    const tabs = `<div class="tabs" role="tablist">
      <button class="tab ${ready && shopTab !== "upgrades" ? "ready" : ""}" role="tab" aria-selected="${shopTab === "upgrades"}" data-tab="upgrades">Upgrades${ready ? " ★" : ""}</button>
      <button class="tab" role="tab" aria-selected="${shopTab === "staff"}" data-tab="staff">Staff</button></div>`;
    let inner;
    if (shopTab === "upgrades") {
      inner = `<div class="ugrid">${upgrades.map((u, i) => {
        const [name, info, ico, lvl, unlock] = u;
        const max = lvl >= 3, locked = DAY < unlock, price = 40 + lvl * 40, can = !max && !locked && coins >= price;
        const label = max ? "Max" : locked ? `Day ${unlock}` : `Buy ${cost(price)}`;
        return `<div class="ucard ${can ? "ready" : ""} ${locked ? "locked" : ""}">
          <div class="uico" aria-hidden="true">${px(ico, 3)}</div><h4>${name}</h4><p>${info}${locked ? ` Unlocks on Day ${unlock}.` : ""}</p>
          <div class="ufoot"><div class="pips" aria-label="Level ${lvl} of 3">${[0, 1, 2].map(k => `<span class="pip ${k < lvl ? "on" : ""}"></span>`).join("")}</div>
          <button class="btn small" data-upg="${i}" ${can ? "" : "disabled"}>${label}</button></div></div>`;
      }).join("")}</div>`;
    } else {
      inner = staff.map((s, i) => {
        let sub, btn, en = true, ready = false;
        if (s.state === "hired") { sub = `${s.info} Level ${s.level}/${s.max}. Mood: ${s.mood}.`; btn = `Upgrade ${cost(s.cost)}`; en = coins >= s.cost; ready = en; }
        else if (s.state === "booked") { sub = "Interview booked: two applicants come in tomorrow morning, before the library opens."; btn = "Cancel"; }
        else { sub = `${s.info} Hire fee about ${s.fee}.`; btn = "Interview"; en = coins >= s.fee; ready = en; }
        return `<div class="srow ${ready ? "ready" : ""}"><div class="avatar" aria-hidden="true">${px(s.icon, 3)}</div>
          <div><h4>${s.role}${s.person ? `: <span class="who">${s.person}</span>` : ""}</h4><p>${sub}</p></div>
          <button class="btn" data-staff="${i}" ${en ? "" : "disabled"}>${btn}</button></div>`;
      }).join("");
    }
    const note = shopTab === "upgrades" ? "Upgrades last forever and are saved with your library." : "Press Interview: two applicants come in tomorrow morning. Staff are paid once, when you hire them.";
    return `${tabs}<div class="scroll">${inner}</div><div class="count-line" style="text-align:center">${note}</div>`;
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function daysIn(m, y) { if (!m) return 31; return new Date(y || 2000, MONTHS.indexOf(m) + 1, 0).getDate(); }
  // Day / Month / Year pickers: a pixel box that opens a list showing 6 items at a time
  function dobDrop(field, label, value, opts, off = () => false) {
    const id = "dob-" + field, open = openMenu === id;
    return `<div class="drop dd-wrap"><button class="dd ${value ? "" : "empty"}" data-menu="${id}" aria-expanded="${open}" aria-label="${label}">${value || label}<span>▾</span></button>
      ${open ? `<div class="menu six" role="menu">${opts.map(o => `<button role="menuitemradio" aria-checked="${o === value}" data-pick="dob" data-field="${field}" data-val="${o}" ${off(o) ? "disabled" : ""}>${o}</button>`).join("")}</div>` : ""}</div>`;
  }

  function memView() {
    const rows = members.map(([n, dob, acc, h, v, sp]) => `<tr><td>${n}</td><td class="hide-sm">${dob}</td><td>${acc}</td>
      <td class="hearts" aria-label="${h} of 5 hearts">${Array.from({ length: 5 }, (_, k) => px(k < h ? "heart" : "heartEmpty", 1)).join("")}</td><td class="num">${v}</td><td class="num hide-sm">${sp}</td></tr>`).join("");
    const max = daysIn(form.month, +form.year);
    const nameOk = /^[A-Za-z][A-Za-z' -]{1,29}$/.test(form.name.trim());
    const ready = nameOk && form.day && form.month && form.year && form.access;
    const years = []; for (let y = 2010; y >= 1930; y--) years.push(y);
    const card = form.done
      ? `<div class="libcard"><h3>NEW LIBRARY CARD</h3><div class="empty">Card issued to ${esc(form.done)}!<br><br>Nobody else is waiting for a card.</div></div>`
      : `<div class="libcard">
        <h3>NEW LIBRARY CARD <small>No. 0006</small></h3>
        <div class="waiting">A visitor at the counter is waiting for a card. Type the name they told you.</div>
        <div class="field"><label for="f-name">Name</label><input id="f-name" maxlength="30" placeholder="type the name they told you" value="${esc(form.name)}" autocomplete="off"></div>
        <div class="field"><span class="lbl">Date of birth</span>
          <div class="dob">
            ${dobDrop("day", "Day", form.day, Array.from({ length: 31 }, (_, i) => String(i + 1)), d => +d > max)}
            ${dobDrop("month", "Month", form.month, MONTHS)}
            ${dobDrop("year", "Year", form.year, years.map(String))}
          </div></div>
        <div class="field"><span class="lbl">Access</span><div class="opts">${["Basic", "Archive", "Rare"].map(a => `<button class="btn small opt" aria-pressed="${form.access === a}" data-acc="${a}">${a}</button>`).join("")}</div></div>
        <button class="btn primary issue" data-act="issue" ${ready ? "" : "disabled"}>Issue card</button>
      </div>`;
    return `<div class="mem">
      <div class="col"><div class="count-line">${members.length} members</div>
        <div class="scroll sheet"><table class="mtable"><thead><tr><th>Name</th><th class="hide-sm">Born</th><th>Access</th><th>Happy</th><th style="text-align:right">Visits</th><th class="hide-sm" style="text-align:right">Spent</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      ${card}</div>`;
  }

  function logView() {
    const days = [1, 2, 3].map(d => `<button class="btn small ${d === logDay ? "primary" : ""}" data-day="${d}">Day ${d}${d === DAY ? " (today)" : ""}</button>`).join("");
    const entries = log[logDay];
    const money = n => n === 0 ? "" : `<span class="amt ${n > 0 ? "plus" : "minus"}">${n > 0 ? "+" : "−"}${px("coin", 1)}${Math.abs(n)}</span>`;
    const rows = [...entries].reverse().map(([t, who, line, out, c, amt]) => `<div class="logrow ${c === "spend" ? "spend" : ""}"><span class="time">${hm(t)}</span>
      ${c === "spend" ? `<span class="mark coinmark">${px("coin", 1)}</span>` : `<span class="mark" style="background:var(--${c})"></span>`}
      <div class="what">${esc(line)}<small>${esc(who)}</small></div><span class="out"><span class="${c === "spend" ? "" : c}">${out}</span>${money(amt)}</span></div>`).join("");
    return `<div class="days">${days}</div><div class="scroll sheet">${rows}</div>`;
  }

  function setView() {
    const bar = (v, key) => `<div class="bar">${Array.from({ length: 10 }, (_, i) => `<button class="${i < v ? "on" : ""}" data-pip="${key}" data-v="${i + 1}" style="--h:${16 + i * 4}px" aria-label="${key} ${i + 1}"></button>`).join("")}</div>`;
    return `<div class="scroll sheet">
      <div class="set"><span>Volume</span>${bar(vol, "vol")}<div class="ctl"><button class="btn small" data-step="vol:-1">-</button><button class="btn small" data-step="vol:1">+</button></div></div>
      <div class="set"><span>Music</span>${bar(music, "music")}<div class="ctl"><button class="btn small" data-step="music:-1">-</button><button class="btn small" data-step="music:1">+</button></div></div>
      <div class="set"><span>Fullscreen</span><span class="val">${full ? "On" : "Off"}</span><div class="ctl"><button class="btn small" data-act="full">Toggle</button></div></div>
      <div class="set"><span>Main menu</span><span class="val">${confirm === "menu" ? "Today's progress isn't saved. Sure?" : "Back to the title screen."}</span><div class="ctl"><button class="btn small" data-act="menu">${confirm === "menu" ? "Yes, leave" : "Go"}</button></div></div>
      <div class="set"><span>New game</span><span class="val">${confirm === "reset" ? "Are you sure? All progress is lost." : "Start again from Day 1."}</span><div class="ctl"><button class="btn small danger" data-act="reset">${confirm === "reset" ? "Yes, reset" : "Reset"}</button></div></div>
    </div><div class="count-line" style="text-align:center">Your library saves itself every morning when a new day starts.</div>`;
  }

  // ---------- Events ----------
  document.addEventListener("click", e => {
    if (e.target.closest("#off")) { $("off").hidden = true; return; }
    const t = e.target.closest("button, .row");
    if (!t) { if (openMenu) { openMenu = null; render(); } return; }
    const d = t.dataset;
    if (d.win) {
      if (d.win === "max") { $("pc").classList.toggle("max"); return; }
      $("off").innerHTML = d.win === "close" ? "<div><b>LOGGED OFF</b>Back to the library. Click to log on again.</div>" : "<div><b>MINIMISED</b>The PC stays where you left it. Click to bring it back.</div>";
      $("off").hidden = false; return;
    }
    if (d.go) {
      page = d.go; openMenu = null; confirm = null; msg = "";
      if (d.fresh) { sel = null; q = ""; fSub = fType = fShow = "All"; }
      render(); return;
    }
    if (d.menu) { openMenu = openMenu === d.menu ? null : d.menu; render(); return; }
    if (d.pick) {
      if (d.pick === "dob") {
        form[d.field] = d.val; form.done = "";
        if (form.day && +form.day > daysIn(form.month, +form.year)) form.day = ""; // a day that stops existing is cleared
      }
      else if (d.pick === "type") { fType = d.val; fSub = "All"; }
      else if (d.pick === "sub") fSub = d.val;
      else fShow = d.val;
      openMenu = null; render(); return;
    }
    if (d.book !== undefined) { sel = books[+d.book]; msg = ""; openMenu = null; render(); return; }
    if (d.act === "note" && sel) { noted.add(sel); msg = `Noted: "${sel.t}" (${SHELF[sel.sh]})`; msgGood = true; render(); return; }
    if ((d.act === "order" || d.act === "express") && sel) {
      const ex = d.act === "express", p = price(sel, ex);
      if (coins < p) return;
      coins -= p; sel.order++;
      addLog("You", `${ex ? "Express order" : "Ordered"} “${sel.t}” (${ex ? "arrives in 2 hours" : "arrives tomorrow"})`, ex ? "Express order" : "Book order", "spend", -p);
      if (ex) arrivals.push({ at: minutes + 120, title: sel.t });
      msg = ex ? `Express ordered! It arrives on the book cart at ${fmt(minutes + 120)}.` : `Ordered! It arrives on the book cart tomorrow morning (${sel.order} on order).`;
      msgGood = true; render(); return;
    }
    if (d.tab) { shopTab = d.tab; render(); return; }
    if (d.upg !== undefined) { const u = upgrades[+d.upg], c = 40 + u[3] * 40; if (coins >= c) { coins -= c; u[3]++; addLog("You", `Bought ${u[0]} (level ${u[3]})`, "Upgrade", "spend", -c); } render(); return; }
    if (d.staff !== undefined) {
      const s = staff[+d.staff];
      if (s.state === "hired") { if (coins >= s.cost && s.level < s.max) { coins -= s.cost; s.level++; addLog(s.person, `${s.role} trained to level ${s.level}`, "Staff upgrade", "spend", -s.cost); s.cost *= 2; } }
      else s.state = s.state === "booked" ? "open" : "booked";
      render(); return;
    }
    if (d.acc) { form.access = d.acc; render(); return; }
    if (d.act === "issue") {
      const n = form.name.trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      members.push([n, `${form.day.padStart(2, "0")} ${form.month} ${form.year}`, form.access, 3, 1, 0]);
      form = { name: "", day: "", month: "", year: "", access: null, done: n }; render(); return;
    }
    if (d.day) { logDay = +d.day; render(); return; }
    if (d.pip) { const v = +d.v; if (d.pip === "vol") vol = v === vol ? 0 : v; else music = v === music ? 0 : v; render(); return; }
    if (d.step) { const [k, s] = d.step.split(":"); if (k === "vol") vol = Math.max(0, Math.min(10, vol + +s)); else music = Math.max(0, Math.min(10, music + +s)); render(); return; }
    if (d.act === "full") { full = !full; render(); return; }
    if (d.act === "menu" || d.act === "reset") {
      if (confirm === d.act) { confirm = null; msg = ""; } else { confirm = d.act; setTimeout(() => { if (confirm === d.act) { confirm = null; render(); } }, 4000); }
      render(); return;
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("row")) e.target.click();
    if (e.key === "Escape" && openMenu) { openMenu = null; render(); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "search") {
      q = e.target.value; const pos = e.target.selectionStart;
      render(); const inp = $("search"); inp.focus(); inp.setSelectionRange(pos, pos);
    }
    if (e.target.id === "f-name") {
      // Only letters, single spaces, hyphens and apostrophes get into the box.
      const clean = e.target.value.replace(/[^A-Za-z' -]/g, "").replace(/ {2,}/g, " ").slice(0, 30);
      form.name = clean; form.done = "";
      const pos = Math.min(e.target.selectionStart, clean.length);
      render(); const inp = $("f-name"); inp.focus(); inp.setSelectionRange(pos, pos);
    }
  });
  document.addEventListener("change", e => {
  });

  // The clock keeps running while the PC is open (1 game minute every 2 real seconds here).
  // The clock moves 10 game minutes at a time. The game does 9:00 to 5:30 in about 4 real minutes, so one step is about 4.7 s.
  setInterval(() => {
    if (minutes >= CLOSE) return;
    minutes = Math.min(CLOSE, minutes + 10); $("clock").textContent = fmt(minutes);
    if ($("tl-now")) { $("tl-now").style.left = $("tl-fill").style.width = tlX(minutes); $("tl-left").textContent = leftText(); }
  }, 4700);

  sel = books[6]; // the sold-out, reserved book: shows the most at once
  page = "home";
  $("clock").textContent = fmt(minutes);
  render();
})();
</script>
